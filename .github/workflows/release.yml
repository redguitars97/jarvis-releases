# Every published release: the update channel the app reads (latest.json) must name this version and point to
# installers that really exist in the release, or Jarvis would tell customers about a download that fails.
name: Verifica release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canale-aggiornamenti:
    name: Canale aggiornamenti
    runs-on: ubuntu-latest
    steps:
      - name: latest.json coerente con la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir .
          version=$(jq -r .version latest.json)
          [ "v$version" = "$tag" ] || { echo "latest.json dice $version ma la release è $tag"; exit 1; }
          for key in mac win; do
            url=$(jq -r ".$key // empty" latest.json)
            [ -z "$url" ] && { echo "$key: nessun installer indicato"; continue; }
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url")
            [ "$code" = "200" ] || { echo "$key: $url risponde $code"; exit 1; }
            echo "$key: $url ok"
          done
